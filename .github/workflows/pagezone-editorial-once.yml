name: PageZone editorial once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pagezone-editorial-once.yml'

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar capítulo 20 e atualizar memória curta
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const p = (...x) => path.join(root, ...x);
          const bookDir = p('livros','urbans-family');
          const readJson = f => JSON.parse(fs.readFileSync(f,'utf8'));
          const writeJson = (f,o) => fs.writeFileSync(f, JSON.stringify(o,null,2)+'\n');

          const chaptersPath = path.join(bookDir,'chapters.json');
          const chaptersDoc = readJson(chaptersPath);
          const chapters = chaptersDoc.chapters || [];
          const last = chapters[chapters.length-1];
          if (last?.number !== 19) {
            if (chapters.some(c => c.number === 20)) process.exit(0);
            throw new Error('Esperado capítulo 19 como último publicado.');
          }

          const bodyHtml = `<p>Nando voltou do atendimento com o lado esquerdo do rosto inchado e uma faixa curta sobre a sobrancelha. O pátio, que normalmente engolia qualquer fraqueza em poucos minutos, ficou estranho quando ele atravessou o corredor. Ninguém riu. Ninguém perguntou. Os homens que tinham seguido João na movimentação do dia anterior apenas desviaram os olhos.</p>
        <p>João entendeu o recado antes mesmo de Nando sentar. Andrade não precisava vencer uma guerra. Bastava convencer cada homem de que ficar perto de João custava mais caro do que abandoná-lo.</p>
        <p>— Se alguém quiser sair, sai agora — disse João, baixo, sem transformar aquilo em discurso. — Ninguém me deve coragem.</p>
        <p>Torres ergueu o olhar, incomodado, mas João continuou.</p>
        <p>— O erro foi meu. Eu aceitei a informação, escolhi o momento e coloquei vocês no caminho. Quem ficar daqui para frente vai saber por quê. E eu também vou saber o que estou pedindo.</p>
        <p>Nando passou a língua pelo canto machucado da boca. — Eu fico. Mas eu quero saber como ele sabia.</p>
        <p>— Eu também.</p>
        <p>Naquela tarde, João não procurou o traidor. Procurou o caminho da informação. Era diferente. Um homem podia mentir; um caminho deixava repetição.</p>
        <p>Quando Mendes apareceu no corredor, João pediu apenas uma coisa: uma mudança de horário para o dia seguinte. Disse que precisava passar pela capela porque um advogado ligado a Carlos tentaria deixar um recado sobre Ana e Clara. Mendes franziu o rosto.</p>
        <p>— Isso não funciona assim.</p>
        <p>— Então faz funcionar.</p>
        <p>Mendes hesitou, mas anotou o pedido na prancheta. João viu a caneta tocar o papel e, pela primeira vez desde o bilhete de Andrade, sentiu que não estava reagindo no escuro.</p>
        <p>Depois, em outro corredor, João contou a Nando uma versão diferente: se alguém perguntasse, ele estaria tentando chegar à enfermaria no mesmo horário. Torres foi o único a ouvir a explicação verdadeira.</p>
        <p>— Duas histórias — murmurou Torres. — E a gente vê qual delas volta.</p>
        <p>— Não. A gente vê por onde ela volta.</p>
        <p>Na manhã seguinte, João não foi nem à capela nem à enfermaria. Ficou com Torres num ponto do segundo piso de onde conseguiam observar a movimentação sem chamar atenção. Pouco antes do horário registrado por Mendes, dois homens ligados a Andrade apareceram perto do corredor da capela. Não entraram. Apenas ficaram espalhados, como quem esperava uma confirmação.</p>
        <p>A enfermaria permaneceu vazia.</p>
        <p>Torres sorriu sem humor. — Mendes.</p>
        <p>João não respondeu. Ainda era cedo demais.</p>
        <p>Minutos depois, Mendes passou pelo posto interno e deixou a prancheta sobre a mesa. Não falou com ninguém. Seguiu corredor abaixo. Um agente que João já tinha visto dezenas de vezes pegou o livro de movimentações, conferiu as anotações e saiu por uma porta lateral. Pouco depois, o telefone de serviço tocou uma única vez e parou. Um toque curto. Quase nada.</p>
        <p>João observou os dois homens perto da capela se afastarem logo em seguida.</p>
        <p>Não era prova suficiente para limpar Mendes. Mas era a primeira pista que mudava o desenho inteiro: Andrade não precisava estar ouvindo cada conversa. Alguém tinha acesso às rotinas oficiais de movimentação da prisão e transformava papel burocrático em vigilância.</p>
        <p>— Ele não escuta a gente — disse João. — Ele lê a cadeia.</p>
        <p>Torres acompanhou com os olhos o agente que havia levado o livro. — Então agora a gente sabe onde está a janela.</p>
        <p>João pensou em Ana. Em Clara. Em Carlos sendo usado como mensageiro. Se Andrade conseguia transformar um registro interno em arma, podia fazer o mesmo com visitas, transferências, advogados e qualquer tentativa de contato com o lado de fora.</p>
        <p>Na volta para a cela, encontrou um papel dobrado sobre o colchão.</p>
        <p>Seu estômago endureceu.</p>
        <p>Abriu.</p>
        <p>“Você encontrou a janela. Ainda não encontrou a mão.”</p>
        <p>João ficou imóvel por alguns segundos. Depois dobrou o bilhete novamente e o entregou a Torres.</p>
        <p>Andrade ainda estava um passo à frente.</p>
        <p>Mas, pela primeira vez, João sabia em que direção correr.</p>`;

          chapters.push({number:20,displayNumber:'Capítulo 20',title:'O Eco',bodyHtml});
          chaptersDoc.chapters = chapters;
          writeJson(chaptersPath, chaptersDoc);

          const bookPath = path.join(bookDir,'book.json');
          const book = readJson(bookPath);
          book.chapters.currentPublished = 20;
          writeJson(bookPath, book);

          fs.writeFileSync(path.join(bookDir,'memoria.md'), `# Memória narrativa — Urbans Family\n\n## Estado atual\nJoão Carvalho está preso e transformando sobrevivência em influência para proteger Ana e Clara de longe. Ana pediu divórcio, mas mantém o vínculo de João com Clara. Carlos continua como elo externo sob pressão de Andrade.\n\nDepois da armadilha do capítulo 19, a aliança de João foi abalada pela agressão contra Nando. No capítulo 20, João assume a responsabilidade pelo risco imposto aos aliados e testa o caminho da informação em vez de acusar um traidor. Ele fornece duas versões diferentes sobre sua movimentação e descobre que os homens de Andrade reagem à versão registrada oficialmente por Mendes. A observação indica que o canal de vigilância passa pelos registros internos de movimentação da prisão. Mendes continua suspeito, mas já não é possível afirmar que ele próprio seja o vazamento. Andrade demonstra saber que João encontrou esse canal e envia novo bilhete: “Você encontrou a janela. Ainda não encontrou a mão.”\n\n## Personagens relevantes\n- **João Carvalho** — preso; liderança mais consciente do custo imposto aos aliados; agora conhece um canal provável de vigilância de Andrade.\n- **Ana** — separada de João; potencialmente vulnerável à pressão de Andrade.\n- **Clara** — filha de João e Ana; principal motivação emocional de João.\n- **Carlos** — aliado externo sob pressão de Andrade.\n- **Torres** — principal aliado operacional interno; participou do teste que revelou o canal.\n- **Andrade** — ameaça central; possui acesso indireto às rotinas internas e continua um passo à frente.\n- **Mendes** — guarda corrupto ligado a Andrade; registrou a falsa movimentação usada no teste, mas não foi visto transmitindo diretamente a informação.\n- **Nando** — aliado agredido; decidiu permanecer com João apesar da retaliação.\n- **Diego Santos** — baleado pela polícia no capítulo 13; morte não confirmada pelo texto.\n\n## Conflito central atual\nJoão quer proteger a família e recuperar controle, mas precisa construir poder dentro do mesmo sistema que destruiu sua vida. Agora descobriu que Andrade explora a burocracia da prisão como rede de vigilância, sem ainda saber quem transforma os registros em informação para o rival.\n\n## Pontas abertas\n- Identificar a pessoa que acessa ou repassa os registros de movimentação para Andrade.\n- Determinar o papel real de Mendes.\n- Evitar que Andrade use registros de visitas, advogados ou contatos externos contra Ana, Clara e Carlos.\n- Consolidar a aliança após a agressão contra Nando.\n- Explorar o custo moral da ascensão de João.\n- Confirmar o estado definitivo de Diego.\n\n## Última mudança publicada\nNo capítulo 20, **O Eco**, João cria um teste com duas informações diferentes e descobre que a versão registrada na rotina oficial da prisão chega aos homens de Andrade. Ele encontra a “janela” da vigilância, mas não a pessoa por trás dela.\n\n## Objetivo narrativo imediato\nTransformar a descoberta em vantagem controlada: João deve usar o canal identificado para plantar uma informação que force o operador oculto a agir, sem expor Ana, Clara ou seus aliados.\n\n## Regra de continuidade\n\`chapters.json\` é a fonte canônica do publicado. Em caso de conflito, o texto publicado prevalece.\n`);

          const continuity = {
            schemaVersion:1, bookId:'urbans-family', editorialState:'WRITING',
            publishedRange:{first:0,last:20}, lastChapter:{number:20,title:'O Eco'},
            characterLedger:[
              {name:'João Carvalho',status:'preso; descobriu que a vigilância de Andrade passa pelos registros internos de movimentação',location:'prisão'},
              {name:'Ana',status:'separada de João; potencialmente vulnerável à pressão de Andrade',location:'fora da prisão'},
              {name:'Clara',status:'filha de João e Ana; principal motivação de João',location:'com Ana'},
              {name:'Carlos',status:'aliado externo sob pressão de Andrade',location:'fora da prisão'},
              {name:'Torres',status:'principal aliado operacional; ajudou João a testar o canal de vigilância',location:'prisão'},
              {name:'Andrade',status:'ameaça central; recebe informação derivada das rotinas oficiais da prisão e sabe que João detectou o canal',location:'não confirmada'},
              {name:'Mendes',status:'registrou a falsa movimentação do teste; não foi visto transmitindo a informação diretamente; lealdade segue incerta',location:'prisão'},
              {name:'Nando',status:'agredido por seguir João; decidiu permanecer na aliança',location:'prisão'},
              {name:'Diego Santos',status:'baleado pela polícia no capítulo 13; morte não confirmada',location:'não confirmada'}
            ],
            openThreads:[
              'Identificar quem transforma registros internos de movimentação em informação para Andrade.',
              'Determinar se Mendes participa conscientemente do vazamento ou é apenas parte do processo explorado.',
              'Usar o canal descoberto para criar vantagem sem expor os aliados.',
              'Entender até onde Andrade alcança visitas e contatos externos ligados a Ana, Clara e Carlos.',
              'Explorar o custo moral e prático da ascensão de João.',
              'O estado definitivo de Diego permanece não confirmado.'
            ],
            chronology:[
              'João entra no crime após perder o emprego e precisar sustentar a família.',
              'Diego o integra gradualmente a operações violentas.',
              'Ana deixa a casa com Clara; João tenta sair do grupo.',
              'João foge com ajuda de Carlos e confronta Diego.',
              'Diego é baleado pela polícia e João se entrega.',
              'Na prisão, Ana pede divórcio e João começa a construir influência.',
              'João descobre a ligação de Carlos com Andrade.',
              'João se alia a Torres e investiga a rede de Andrade.',
              'Mendes revela uma movimentação de drogas; Andrade usa a reação como isca e identifica aliados de João.',
              'Nando é agredido e João testa duas versões de uma movimentação.',
              'A versão registrada oficialmente atrai homens de Andrade, revelando que o canal de vigilância passa pelos registros internos da prisão.'
            ],
            nextAction:'Usar o canal de registros como contra-vigilância: plantar uma informação controlada que obrigue o operador oculto a se revelar, sem colocar a família ou aliados em risco.',
            chapterLedgerSource:'chapters.json', spoilersInternal:true
          };
          writeJson(path.join(bookDir,'continuidade.json'), continuity);

          fs.writeFileSync(path.join(bookDir,'planejamento.md'), `# Planejamento editorial — Urbans Family\n\n## Estado\nCapítulo 20 publicado. João reagiu à armadilha sem acusar um traidor às cegas e descobriu que a vigilância de Andrade passa pelos registros oficiais de movimentação da prisão.\n\n## Arco atual\nJoão continua preso, tentando transformar sobrevivência em poder para proteger Ana e Clara. Torres permanece como principal aliado. Nando resistiu à intimidação. Mendes segue útil e suspeito, mas o teste mostrou que a informação pode estar vazando pelo sistema burocrático da prisão, não necessariamente por uma delação direta dele. Andrade sabe que João encontrou o canal.\n\n## Movimento imediato\nA próxima continuação deve converter a descoberta em contra-vigilância. João precisa plantar uma informação controlada nos registros e observar quem age a partir dela, estreitando o caminho até a “mão” mencionada por Andrade.\n\nA continuação deve:\n- usar a descoberta do capítulo 20 como ação, não apenas conversa;\n- preservar a incerteza sobre Mendes;\n- fazer o operador oculto deixar um sinal identificável;\n- manter o risco sobre Ana, Clara e Carlos como limite para os testes de João;\n- mostrar a liderança de João se tornando mais estratégica e responsável;\n- manter Andrade perigoso e inteligente;\n- evitar resolver toda a rede em um único capítulo.\n\n## Restrições de continuidade\n- Não declarar Diego morto.\n- Não declarar Marcos morto como fato confirmado.\n- Não transformar Mendes em aliado fiel ou traidor definitivo sem evidência adicional.\n- Não assumir Ana e Clara totalmente seguras.\n\n## Próximo marco editorial\nFazer João usar a “janela” dos registros para forçar um movimento observável do operador de Andrade e terminar com uma identificação parcial, vínculo institucional ou nova ameaça que aproxime a investigação da pessoa responsável.\n`);

          fs.writeFileSync(path.join(bookDir,'proxima-jornada.md'), `# Próxima jornada — Urbans Family\n\n## Onde a história parou\nCapítulo 20, **O Eco**: João assumiu o custo da armadilha diante dos aliados, criou duas versões de uma falsa movimentação e descobriu que a versão registrada oficialmente por Mendes chegou aos homens de Andrade. O provável canal de vigilância são os registros internos de movimentação da prisão. Andrade sabe que João percebeu isso e enviou um bilhete: “Você encontrou a janela. Ainda não encontrou a mão.”\n\n## Objetivo da próxima jornada\nUsar a janela descoberta como contra-vigilância. João deve plantar uma informação controlada nos registros para obrigar o operador oculto a agir e deixar uma pista identificável.\n\n## Tensão a manter\n- Mendes continua suspeito, mas não foi visto transmitindo a informação diretamente.\n- Andrade ainda está um passo à frente e sabe que João está investigando o canal.\n- Nando permaneceu na aliança apesar da agressão.\n- Qualquer teste que envolva visitas ou contatos externos pode ameaçar Ana, Clara e Carlos.\n\n## Personagens em foco\nJoão, Torres e Mendes. Nando pode aparecer como sinal da coesão da aliança. O operador oculto deve ganhar contorno sem ser totalmente resolvido.\n\n## Risco editorial\nNão repetir o teste do capítulo 20 com nomes trocados. O próximo movimento precisa transformar a descoberta em contra-vigilância e produzir um novo nível de evidência.\n\n## Tarefa\nEscrever a continuação direta de **O Eco**, usando os registros como isca controlada para aproximar João da pessoa que alimenta Andrade. Atualizar capítulos, metadados, memória, continuidade e este handoff após a publicação.\n`);

          const statePath = p('editorial-state.json');
          const state = readJson(statePath);
          state.activeBookId = 'urbans-family';
          state.stage = 'WRITING';
          state.lastExecution = new Date().toISOString().slice(0,10);
          state.nextObjective = 'Usar o canal de registros identificado no capítulo 20 como contra-vigilância para aproximar João do operador oculto de Andrade.';
          writeJson(statePath,state);
          NODE

          npm run build
          npm run validate
          npm run check

          git config user.name "PageZone Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add editorial-state.json livros/urbans-family data/books.json books.json
          git commit -m "feat(urbans-family): publicar capítulo 20 O Eco"
          git push
