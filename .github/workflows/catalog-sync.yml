name: Sync public catalog

on:
  push:
    branches: [main]
    paths:
      - 'livros/**/book.json'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-catalog.js
      - name: Commit generated catalog
        run: |
          git config user.name "pagezone-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books.json data/books.json
          if git diff --cached --quiet; then
            echo "Catalog already synchronized."
            exit 0
          fi
          git commit -m "build: sync public catalog"
          git push
